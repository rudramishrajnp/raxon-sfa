<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Outer Gold Ring Gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA9E3B" />
      <stop offset="20%" stop-color="#F7E298" />
      <stop offset="40%" stop-color="#D4AA44" />
      <stop offset="60%" stop-color="#FFF0B8" />
      <stop offset="80%" stop-color="#BD8F2A" />
      <stop offset="100%" stop-color="#916715" />
    </linearGradient>

    <!-- Metallic Gold Gradient for X, Lettering and Roots -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8AF44" />
      <stop offset="25%" stop-color="#FFF2BF" />
      <stop offset="50%" stop-color="#C6992E" />
      <stop offset="75%" stop-color="#F2D785" />
      <stop offset="100%" stop-color="#966C15" />
    </linearGradient>

    <!-- Deep Gold for Shadows / Bevels -->
    <linearGradient id="goldDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9E731C" />
      <stop offset="100%" stop-color="#5C3E08" />
    </linearGradient>

    <!-- Tree Foliage Gradients -->
    <linearGradient id="treeGreenDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D8340" />
      <stop offset="100%" stop-color="#124E22" />
    </linearGradient>

    <linearGradient id="treeGreenMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#216D32" />
    </linearGradient>

    <linearGradient id="treeGreenLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="100%" stop-color="#388E3C" />
    </linearGradient>

    <linearGradient id="leafGleam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="50%" stop-color="#66BB6A" />
      <stop offset="100%" stop-color="#A5D6A7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#554015" flood-opacity="0.25" />
    </filter>
  </defs>

  
    <!-- White Background Disk -->
    <circle cx="512" cy="512" r="510" fill="#FFFFFF" />
  

  <g transform="translate(0, 0) scale(1)">
    
    <!-- 1. Outer Polished Gold Circular Ring Border -->
    <circle cx="512" cy="512" r="482" fill="none" stroke="url(#goldRing)" stroke-width="36" />
    <circle cx="512" cy="512" r="458" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.9" />
    <circle cx="512" cy="512" r="454" fill="none" stroke="#AA7F24" stroke-width="3" stroke-opacity="0.6" />

    <!-- 2. Lush Green Foliage Crown (Tree Canopy) -->
    <g id="treeCanopy">
      <!-- Outer Base Foliage Silhouette -->
      <path d="M 512,145 
               C 620,145 715,190 770,250 
               C 825,310 855,395 845,465 
               C 835,535 780,590 720,615 
               C 670,635 600,620 560,570 
               C 535,540 512,500 512,500 
               C 512,500 489,540 464,570 
               C 424,620 354,635 304,615 
               C 244,590 189,535 179,465 
               C 169,395 199,310 254,250 
               C 309,190 404,145 512,145 Z" 
            fill="url(#treeGreenDark)" />

      <!-- Layer 1: Canopy Leaf Clusters (Mid Green) -->
      <!-- Top Center Crown -->
      <path d="M 512,130 C 530,170 545,210 545,250 C 545,290 530,320 512,340 C 494,320 479,290 479,250 C 479,210 494,170 512,130 Z" fill="url(#treeGreenLight)" />
      <path d="M 470,150 C 500,185 520,230 515,270 C 490,275 460,250 445,215 C 435,185 450,160 470,150 Z" fill="url(#treeGreenMid)" />
      <path d="M 554,150 C 534,160 549,185 539,215 C 524,250 494,275 469,270 C 464,230 484,185 514,150 Z" fill="url(#treeGreenMid)" transform="translate(1024, 0) scale(-1, 1)" />

      <!-- Upper Left & Right Symmetrical Main Leaf Fronds -->
      <!-- Left Upper Leaves -->
      <path d="M 410,180 C 445,210 470,255 455,295 C 425,305 390,285 375,250 C 365,220 385,190 410,180 Z" fill="url(#leafGleam)" />
      <path d="M 350,220 C 390,245 410,290 395,330 C 365,340 330,320 315,285 C 305,255 325,230 350,220 Z" fill="url(#treeGreenMid)" />
      <path d="M 300,270 C 340,290 360,335 345,375 C 315,385 280,365 265,330 C 255,300 275,280 300,270 Z" fill="url(#leafGleam)" />
      <path d="M 255,330 C 295,345 315,390 300,430 C 270,440 235,420 220,385 C 210,355 230,335 255,330 Z" fill="url(#treeGreenDark)" />
      <path d="M 220,400 C 260,410 280,450 265,490 C 235,500 200,480 185,445 C 175,415 195,405 220,400 Z" fill="url(#treeGreenMid)" />
      <path d="M 195,470 C 235,475 255,510 240,550 C 210,560 175,540 160,505 C 150,475 170,470 195,470 Z" fill="url(#treeGreenDark)" />
      <path d="M 240,530 C 275,530 295,560 280,595 C 255,605 225,590 215,560 C 210,535 225,530 240,530 Z" fill="url(#leafGleam)" />

      <!-- Right Upper Leaves (Mirror via transform) -->
      <g transform="translate(1024, 0) scale(-1, 1)">
        <path d="M 410,180 C 445,210 470,255 455,295 C 425,305 390,285 375,250 C 365,220 385,190 410,180 Z" fill="url(#leafGleam)" />
        <path d="M 350,220 C 390,245 410,290 395,330 C 365,340 330,320 315,285 C 305,255 325,230 350,220 Z" fill="url(#treeGreenMid)" />
        <path d="M 300,270 C 340,290 360,335 345,375 C 315,385 280,365 265,330 C 255,300 275,280 300,270 Z" fill="url(#leafGleam)" />
        <path d="M 255,330 C 295,345 315,390 300,430 C 270,440 235,420 220,385 C 210,355 230,335 255,330 Z" fill="url(#treeGreenDark)" />
        <path d="M 220,400 C 260,410 280,450 265,490 C 235,500 200,480 185,445 C 175,415 195,405 220,400 Z" fill="url(#treeGreenMid)" />
        <path d="M 195,470 C 235,475 255,510 240,550 C 210,560 175,540 160,505 C 150,475 170,470 195,470 Z" fill="url(#treeGreenDark)" />
        <path d="M 240,530 C 275,530 295,560 280,595 C 255,605 225,590 215,560 C 210,535 225,530 240,530 Z" fill="url(#leafGleam)" />
      </g>

      <!-- Tier 2: Interior Bush Leaf Details -->
      <!-- Center Middle Leaves Clusters -->
      <path d="M 460,230 C 490,260 505,305 490,345 C 465,355 435,335 425,305 C 415,275 435,245 460,230 Z" fill="url(#treeGreenLight)" />
      <path d="M 564,230 C 534,260 519,305 534,345 C 559,355 589,335 599,305 C 609,275 589,245 564,230 Z" fill="url(#treeGreenLight)" />

      <path d="M 390,280 C 420,310 435,355 420,395 C 395,405 365,385 355,355 C 345,325 365,295 390,280 Z" fill="url(#treeGreenMid)" />
      <path d="M 634,280 C 604,310 589,355 604,395 C 629,405 659,385 669,355 C 679,325 659,295 634,280 Z" fill="url(#treeGreenMid)" />

      <path d="M 330,340 C 360,370 375,415 360,455 C 335,465 305,445 295,415 C 285,385 305,355 330,340 Z" fill="url(#leafGleam)" />
      <path d="M 694,340 C 664,370 649,415 664,455 C 689,465 719,445 729,415 C 739,385 719,355 694,340 Z" fill="url(#leafGleam)" />

      <path d="M 280,410 C 315,435 325,480 310,515 C 285,525 255,510 245,480 C 235,450 255,420 280,410 Z" fill="url(#treeGreenLight)" />
      <path d="M 744,410 C 709,435 699,480 714,515 C 739,525 769,510 779,480 C 789,450 769,420 744,410 Z" fill="url(#treeGreenLight)" />

      <!-- Center Inner Foliage Arching Over 'X' -->
      <path d="M 512,280 C 535,320 545,365 530,405 C 500,415 470,395 460,365 C 455,335 480,300 512,280 Z" fill="url(#treeGreenMid)" />
      <path d="M 512,280 C 489,320 479,365 494,405 C 524,415 554,395 564,365 C 569,335 544,300 512,280 Z" fill="url(#treeGreenLight)" />
      <path d="M 460,340 C 490,370 495,410 475,445 C 450,455 425,440 415,415 C 410,385 435,355 460,340 Z" fill="url(#leafGleam)" />
      <path d="M 564,340 C 534,370 529,410 549,445 C 574,455 599,440 609,415 C 614,385 589,355 564,340 Z" fill="url(#leafGleam)" />

      <!-- Bottom Crest Leaf Spikes Framing the Golden X -->
      <path d="M 340,480 C 375,495 385,540 370,575 C 345,585 320,570 310,540 C 305,510 320,490 340,480 Z" fill="url(#treeGreenDark)" />
      <path d="M 684,480 C 649,495 639,540 654,575 C 679,585 704,570 714,540 C 719,510 704,490 684,480 Z" fill="url(#treeGreenDark)" />
    </g>

    <!-- 3. Golden Branches Sprouting from X into the Canopy -->
    <g id="goldenBranches" stroke="url(#goldMetallic)" stroke-linecap="round" fill="none">
      <path d="M 440,460 C 400,430 350,410 300,420" stroke-width="12" />
      <path d="M 370,420 C 340,380 290,360 250,370" stroke-width="9" />
      <path d="M 410,440 C 400,390 360,340 310,320" stroke-width="9" />
      <path d="M 460,430 C 460,370 430,310 380,280" stroke-width="10" />
      <path d="M 480,410 C 490,340 480,280 440,240" stroke-width="8" />

      <!-- Symmetrical Right Branches -->
      <path d="M 584,460 C 624,430 674,410 724,420" stroke-width="12" />
      <path d="M 654,420 C 684,380 734,360 774,370" stroke-width="9" />
      <path d="M 614,440 C 624,390 664,340 714,320" stroke-width="9" />
      <path d="M 564,430 C 564,370 594,310 644,280" stroke-width="10" />
      <path d="M 544,410 C 534,340 544,280 584,240" stroke-width="8" />
    </g>

    <!-- 4. Prominent Golden Metallic Letter 'X' -->
    <g id="goldenX" filter="url(#softGlow)">
      <!-- Main Left-to-Right Downward Diagonal of X -->
      <!-- Serif Top Left Bracket -->
      <path d="M 330,410 L 440,410 L 415,445 L 355,445 Z" fill="url(#goldMetallic)" />
      <!-- Serif Bottom Right Bracket -->
      <path d="M 584,625 L 644,625 L 669,660 L 559,660 Z" fill="url(#goldMetallic)" />

      <!-- Main Diagonal Stroke (Left-Top to Right-Bottom) with 3D Bevel -->
      <polygon points="380,430 435,430 645,640 590,640" fill="url(#goldMetallic)" />
      <!-- Darker 3D Bevel Facet -->
      <polygon points="380,430 405,430 615,640 590,640" fill="url(#goldDeep)" opacity="0.4" />
      <!-- Light Highlight Facet -->
      <polygon points="405,430 435,430 645,640 615,640" fill="#FFF8DC" opacity="0.4" />

      <!-- Main Right-to-Left Downward Diagonal of X -->
      <!-- Serif Top Right Bracket -->
      <path d="M 694,410 L 584,410 L 609,445 L 669,445 Z" fill="url(#goldMetallic)" />
      <!-- Serif Bottom Left Bracket -->
      <path d="M 440,625 L 380,625 L 355,660 L 465,660 Z" fill="url(#goldMetallic)" />

      <!-- Main Diagonal Stroke (Right-Top to Left-Bottom) with 3D Bevel -->
      <polygon points="644,430 589,430 379,640 434,640" fill="url(#goldMetallic)" />
      <!-- Darker 3D Bevel Facet -->
      <polygon points="644,430 619,430 409,640 434,640" fill="url(#goldDeep)" opacity="0.45" />
      <!-- Light Highlight Facet -->
      <polygon points="619,430 589,430 379,640 409,640" fill="#FFF8DC" opacity="0.3" />

      <!-- Center Cross Junction Highlight -->
      <polygon points="512,500 545,535 512,570 479,535" fill="url(#goldMetallic)" stroke="#FFF3C4" stroke-width="2" />
    </g>

    <!-- 5. 'RAXON' Golden Uppercase Brand Name -->
    <g id="brandRaxon" filter="url(#softGlow)">
      <text x="512" y="770" 
            text-anchor="middle" 
            font-family="'Montserrat', 'Arial Black', -apple-system, BlinkMacSystemFont, sans-serif" 
            font-size="112" 
            font-weight="900" 
            letter-spacing="10" 
            fill="url(#goldMetallic)" 
            stroke="#8E6517" 
            stroke-width="3">RAXON</text>

      <!-- Specular Highlight Layer on RAXON -->
      <text x="512" y="770" 
            text-anchor="middle" 
            font-family="'Montserrat', 'Arial Black', -apple-system, BlinkMacSystemFont, sans-serif" 
            font-size="112" 
            font-weight="900" 
            letter-spacing="10" 
            fill="none" 
            stroke="#FFF4D0" 
            stroke-width="1.5" 
            stroke-dasharray="16 8">RAXON</text>
    </g>

    <!-- 6. 'SFA' Golden Brand Subtitle -->
    <g id="brandSfa" filter="url(#softGlow)">
      <text x="512" y="870" 
            text-anchor="middle" 
            font-family="'Montserrat', 'Arial Black', -apple-system, BlinkMacSystemFont, sans-serif" 
            font-size="82" 
            font-weight="900" 
            letter-spacing="8" 
            fill="url(#goldMetallic)" 
            stroke="#8E6517" 
            stroke-width="2.5">SFA</text>

      <!-- Specular Highlight Layer on SFA -->
      <text x="512" y="870" 
            text-anchor="middle" 
            font-family="'Montserrat', 'Arial Black', -apple-system, BlinkMacSystemFont, sans-serif" 
            font-size="82" 
            font-weight="900" 
            letter-spacing="8" 
            fill="none" 
            stroke="#FFF4D0" 
            stroke-width="1">SFA</text>
    </g>

    <!-- 7. Intricate Golden Roots Flowing Below RAXON and Around SFA -->
    <g id="goldenRoots" stroke="url(#goldMetallic)" stroke-linecap="round" fill="none">
      <!-- Upper Trunk Base Spreads -->
      <path d="M 480,665 C 440,700 370,780 280,810" stroke-width="10" />
      <path d="M 544,665 C 584,700 654,780 744,810" stroke-width="10" />

      <!-- Left Root Network (Flanking SFA) -->
      <path d="M 370,780 C 330,810 260,840 180,840" stroke-width="8" />
      <path d="M 430,795 C 380,835 310,870 240,890" stroke-width="7" />
      <path d="M 320,840 C 280,870 230,895 180,910" stroke-width="6" />
      <path d="M 360,865 C 330,900 290,920 240,935" stroke-width="5" />
      
      <!-- Roots Underneath SFA (Bottom Arc) -->
      <path d="M 440,885 C 410,915 360,935 300,945" stroke-width="6" />
      <path d="M 470,895 C 450,925 410,945 370,955" stroke-width="5" />
      <path d="M 512,895 C 512,925 500,950 470,965" stroke-width="4" />
      <path d="M 512,895 C 512,925 524,950 554,965" stroke-width="4" />
      <path d="M 554,895 C 574,925 614,945 654,955" stroke-width="5" />
      <path d="M 584,885 C 614,915 664,935 724,945" stroke-width="6" />

      <!-- Right Root Network (Flanking SFA) -->
      <path d="M 654,780 C 694,810 764,840 844,840" stroke-width="8" />
      <path d="M 594,795 C 644,835 714,870 784,890" stroke-width="7" />
      <path d="M 704,840 C 744,870 794,895 844,910" stroke-width="6" />
      <path d="M 664,865 C 694,900 734,920 784,935" stroke-width="5" />

      <!-- Fine Sub-Root Tendrils -->
      <path d="M 280,880 C 250,900 220,915 190,920" stroke-width="3.5" />
      <path d="M 744,880 C 774,900 804,915 834,920" stroke-width="3.5" />
      <path d="M 330,910 C 300,925 270,935 230,940" stroke-width="3" />
      <path d="M 694,910 C 724,925 754,935 794,940" stroke-width="3" />
    </g>

  </g>
</svg>