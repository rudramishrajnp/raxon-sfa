<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced at build time.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Raxon Sales & Operations App">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Raxon SFA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Raxon SFA</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  
  <style>
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      background-color: #f8f9fa;
      flex-direction: column;
    }
    .spinner {
      border: 4px solid rgba(0,0,0,0.1);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border-left-color: #0d6efd;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <div class="loading-container" id="loading-indicator">
    <div class="spinner"></div>
    <p style="font-family: sans-serif; margin-top: 16px; color: #555;">Loading Raxon SFA...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
