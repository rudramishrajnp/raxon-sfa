name: raxon_sfa
description: Raxon Sales & Operations App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  universal_io: ^2.2.2
  flutter:
    sdk: flutter
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  flutter_local_notifications: ^17.1.2
  socket_io_client: ^3.0.0
  uuid: ^4.4.0
  file_picker: ^10.3.2
  image_picker: ^1.1.1
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.4.9
  go_router: ^16.0.0
  
  # Networking
  dio: ^5.9.0
  retrofit: ^4.7.2
  
  # JSON & Code Generation (Annotations)
  json_annotation: ^4.8.1
  freezed_annotation: ^3.1.0
  
  # Local Storage & DB
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.18
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities & Helpers
  jwt_decoder: ^2.0.1
  intl: ^0.20.2
  logger: ^2.0.2
  package_info_plus: ^8.2.1
  device_info_plus: ^11.3.0
  
  # Hardware & Platform
  connectivity_plus: ^6.1.3
  internet_connection_checker_plus: ^2.7.2
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  google_maps_flutter: ^2.15.0
  
  # UI & Media
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9
  camera: ^0.11.0
  cached_network_image: ^3.3.0
  
  # Background execution
  workmanager: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.0
  retrofit_generator: ^10.0.1
  drift_dev: ^2.28.2
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
